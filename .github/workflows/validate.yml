name: Validate notebooks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security:
    name: Notebook contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked content for credential patterns
        run: ./scripts/scan-secrets.sh

      - name: Validate notebook JSON
        run: |
          python3 -m json.tool 01_wti_brent_spread_analysis.ipynb >/dev/null
          python3 -m json.tool 02_oil_price_technical_analysis.ipynb >/dev/null

      - name: Install pinned notebook dependencies
        run: python3 -m pip install "oilpriceapi[pandas]==1.11.0" matplotlib seaborn

      - name: Run the pre-upload release gate
        run: ./scripts/validate_before_upload.sh
